# PowerShell + JSON syntax check for deepseek-harness-launchers
name: Validate PowerShell and JSON

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Check PowerShell syntax
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Recurse -Filter "*.ps1" | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            try {
              [System.Management.Automation.PSParser]::Tokenize($content, [ref]$null) | Out-Null
            } catch {
              $errors += "$($_.Name): $($_.Exception.Message)"
            }
          }
          if ($errors.Count -gt 0) {
            Write-Error "Syntax errors found:"
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          } else {
            Write-Host "✅ All PowerShell scripts passed syntax check!"
          }

      # Check JSON syntax
      - name: Validate JSON files
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Recurse -Filter "*.json" | ForEach-Object {
            try {
              Get-Content $_.FullName -Raw | ConvertFrom-Json | Out-Null
            } catch {
              $errors += "$($_.Name): $($_.Exception.Message)"
            }
          }
          if ($errors.Count -gt 0) {
            Write-Error "Invalid JSON found:"
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          } else {
            Write-Host "✅ All JSON files are valid!"
          }
